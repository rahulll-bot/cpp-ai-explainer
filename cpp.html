<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ Code Explainer (Live AI)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Deep space gradient background */
      background: radial-gradient(circle at 15% 25%, #2a1658 0%, #0d0c22 45%, #052438 100%);
      color: #f1f5f9;
    }

    /* Glassmorphism Card Container */
    .card {
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 35px rgba(56, 189, 248, 0.08);
    }

    /* Header styling */
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8; /* Vibrant cyan */
      letter-spacing: -0.3px;
    }

    .header-title span.icon {
      font-size: 24px;
    }

    .subtext {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    /* Code editor area */
    textarea {
      width: 100%;
      height: 160px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 13.5px;
      line-height: 1.5;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    /* Explain Button */
    button {
      margin-top: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    button:active {
      transform: translateY(0);
    }

    /* Explanation Section */
    .output-label {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 22px;
      margin-bottom: 8px;
    }

    #output {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid #38bdf8; /* Cyan accent border on left */
      border-radius: 10px;
      padding: 16px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 60px;
    }

    .loading {
      color: #38bdf8;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">
      <span class="icon">🤖</span>
      <span>C++ Code Explainer (Live AI)</span>
    </div>
    <div class="subtext">Paste a C++ code snippet and click Explain:</div>

    <textarea id="codeInput" placeholder="#include <iostream>
using namespace std;

int main() {
    auto add = [](int a, int b) {
        return a + b;
    };
    cout << add(2, 3); // prints 5
}"></textarea>

    <button id="submitBtn" onclick="explainCode()">Explain Code</button>

    <div class="output-label">Explanation:</div>
    <div id="output">Paste your C++ code above and click Explain Code...</div>
  </div>

  <script>
    async function explainCode() {
      const code = document.getElementById("codeInput").value;
      const outputDiv = document.getElementById("output");
      const button = document.getElementById("submitBtn");

      if (!code.trim()) {
        alert("Please paste some C++ code first!");
        return;
      }

      outputDiv.innerHTML = '<span class="loading">⏳ Analyzing code...</span>';
      button.disabled = true;
      button.style.opacity = "0.6";

      const prompt = `You are an expert C++ tutor for 2nd-year engineering students. Explain the following C++ code clearly in 3 concise bullet points:\n\n${code}`;

      try {
        // Direct, bulletproof GET request that avoids CORS "Failed to fetch" errors
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const reply = await response.text();
        outputDiv.innerText = reply;

      } catch (error) {
        outputDiv.innerText = "❌ Error: " + error.message + "\n\nTip: Check your internet connection or reload the page.";
      } finally {
        button.disabled = false;
        button.style.opacity = "1";
      }
    }
  </script>
</body>
</html>
